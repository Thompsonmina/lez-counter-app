[package]
name = "lez_counter_core"
version = "0.1.0"
edition = "2021"

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# Only for the `#[account_type]` marker, which is a compile-time pass-through
# consumed by `spel generate-idl`. Keeping it here — rather than declaring the
# struct inside the guest — is what lets the reader share this schema.
spel-framework-macros = { git = "https://github.com/logos-co/spel.git", branch = "main" }
